# experiment.cfg — configuración del experimento, leída por VRepClient al iniciar
# (botón "3. Iniciar"). Se copia íntegra a run_metadata.txt en cada corrida para
# trazabilidad. Formato: clave=valor, comentarios con #. Los circuitos se definen
# en secciones [Circuit:Nombre] seguidas de líneas "x,y" (una por waypoint, en m).
#
# IMPORTANTE: este archivo se lee en tiempo de ejecución (Copy to Output
# Directory=PreserveNewest) — cambiar un valor NO requiere recompilar, solo
# reiniciar la app. Un rebuild también funciona (solo refresca el archivo), así
# que no hay problema si preferís hacerlo igual.
#
# ============================================================================
# PLAN DE LOS 4 EXPERIMENTOS PENDIENTES PARA LOS REVISORES
# (circuito base de 10 repeticiones limpias ya cerrado, ver dataset_segmentos_
# circuito_base.csv). Para pasar de uno a otro, copiar el bloque de "valores"
# correspondiente sobre la sección ACTIVA de abajo y reiniciar la app.
# ============================================================================
#
# [1] CERRADO — Planificador admisible (punto #6 revisores)
#     ControlMode=DifferentialEmulated, PlannerHeuristic=Octile,
#     ArrivalTolerance=0.03, CircuitSequence=CurrentCode, RepetitionsPerCircuit=10
#     Resultado: 10 repeticiones limpias. Rutas ejecutadas ~4.7% más cortas
#     que Manhattan (p<0.001), pero SIN mejora significativa en duración de
#     misión (262 vs 270 s, p=0.401). Ver analysis/output/comparacion_planificador/.
#
# [2] CERRADO — Barrido de tolerancia de llegada (punto #4 revisores)
#     0.03/0.05/0.08/0.10/0.15, todos con >=5 repeticiones limpias.
#     Resultado: duración de misión cae significativamente con tolerancias
#     más flexibles (p=0.0075), pero el tiempo de convergencia en banda fija
#     de 1m no aísla el efecto limpiamente (p=0.06). Ver
#     analysis/output/barrido_tolerancia/.
#
# [3] CERRADO — Modo de control holonómico (punto #5 revisores)
#     10 repeticiones limpias (sumando varias sesiones cortas). Resultado:
#     201.9±9.9 s vs 262.4±14.2 s diferencial — 60.5 s recuperables (23.1% de
#     la misión, p=6.2e-09), tiempo de reorientación eliminado por completo
#     (22.7 s → 0, p=2.8e-08). Ver analysis/output/comparacion_control/.
#
# [4] ACTIVO AHORA — Segundo circuito, geometría distinta (punto #8 revisores)
#     ControlMode=DifferentialEmulated, PlannerHeuristic=Manhattan,
#     ArrivalTolerance=0.03, CircuitSequence=Circuit2, RepetitionsPerCircuit=10
#     Validado: 3/3 repeticiones limpias (sesión 20260905_003654), casi sin
#     incidentes. Subido a 10 para la campaña completa.
#
# ============================================================================
# CONFIGURACIÓN ACTIVA
# ============================================================================

# DifferentialEmulated = comportamiento validado (chasis mecanum operado como
#   diferencial: 2 velocidades, giro en el sitio forzado si |phi|>RotationThreshold).
# Holonomic = control mecanum real con componente lateral, sin parada forzada.
ControlMode=DifferentialEmulated

# Manhattan = heurística original (no admisible en grilla de 8 conexiones).
# Octile = heurística admisible/consistente para el costo axial=1.0/diagonal=1.4
#   actual (Section 2.1) — línea base de planificador admisible (punto #6 revisores).
PlannerHeuristic=Manhattan

# m: distancia de frenado contra el punto perseguido (Drive.cs). Tolerancia
# base — el experimento del segundo circuito no barre tolerancia ni control.
ArrivalTolerance=0.03

# Calibración del modo Holonomic (ver nota [3] arriba). Empezando con la
# hipótesis más probable: mezcla lateral invertida.
HolonomicVxSign=1
HolonomicVySign=-1
HolonomicOmegaSign=1

# m: distancia contra la meta final que dispara el avance al siguiente waypoint.
WaypointAdvanceRadius=0.35

# rad: |phi| por encima del cual el modo diferencial fuerza giro en el sitio.
RotationThreshold=0.4

# m: por debajo de esta distancia a la meta se aplica el amortiguamiento de
# convergencia (fase "Converging" en segment_summary.csv).
ConvergenceBandRadius=1.0
ConvergenceDampingFactor=0.6

LookaheadCells=3
LookaheadAdvance=4

# Ganancia final aplicada a los 4 comandos de rueda normalizados (RobotAdapter.Send).
# Si se prueba Holonomic y el robot se mueve demasiado rápido/lento o en la
# dirección equivocada, ajustar acá (y revisar el signo de las 4 ruedas en
# Drive.GetHolonomicDrive si va al revés).
WheelGain=-5.0

# Salvaguarda de plausibilidad: rechaza cualquier ruta del A* que sea más de
# esta cantidad de veces más larga que la distancia en línea recta al
# objetivo, en vez de ejecutarla ciegamente (agregado tras dos incidentes
# reales de desvíos absurdos por mapa acumulado con ruido — ver Map.cs, nunca
# depura puntos viejos). Si ves muchos IMPLAUSIBLE_PATH_REJECTED en un tramo
# genuinamente sinuoso, subí este valor; si siguen ocurriendo desvíos
# absurdos, bajalo.
MaxPathLengthRatio=3.0

# Segunda salvaguarda, complementaria a la anterior: si la distancia al
# objetivo empeora más de este valor (m) respecto al mejor progreso logrado
# en el segmento, se fuerza un replanteo. MaxPathLengthRatio solo atrapa UN
# plan puntual desproporcionado; esto atrapa un alejamiento GRADUAL
# (replanteo tras replanteo, cada uno luciendo razonable) — confirmado en una
# corrida real donde el robot viajó ~5 m en la dirección opuesta al objetivo
# sin que ningún plan individual disparara la otra salvaguarda.
WrongDirectionMarginM=2.0

# Repeticiones de CADA circuito antes de pasar al siguiente en CircuitSequence.
# Circuit2 validado (3/3 limpias) — campaña completa de 10.
RepetitionsPerCircuit=10

# Lista de circuitos a correr en orden, cada uno repetido RepetitionsPerCircuit
# veces.
CircuitSequence=Circuit2

