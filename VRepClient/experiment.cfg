[Circuit:Circuit2]
# Segundo circuito para el punto #8 de los revisores (generalización a
# geometría independiente). Intento 1 (coordenadas nuevas) tuvo mucha más
# dificultad que CurrentCode desde la repetición 1 (10-23 s replanificando
# por segmento) y terminó trabado — sin ver la escena no se puede saber si
# cruza zonas más obstruidas. Revertido.
#
# Intento 2 (este): los MISMOS 9 puntos de CurrentCode, reordenados, sin
# repetir ningún waypoint dos veces seguidas. Todos los tramos consecutivos
# quedan en <=6.02 m (vs hasta 9.9 m en CurrentCode/PaperTable1) — más
# conservador a propósito, ya que estos puntos ya se sabe que son alcanzables
# (aparecen en CurrentCode), aunque los tramos ENTRE ellos en este nuevo
# orden no se probaron antes.
2.0,5.0
-2.0,5.0
2.2,5.0
0.0,4.0
-2.5,5.0
-2.0,-1.0
2.0,-1.5
-2.0,-5.0
2.0,-4.0
-2.0,-1.0
